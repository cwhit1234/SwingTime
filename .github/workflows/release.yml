name: Package and release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags so the changelog is built correctly

      - name: Package and upload
        uses: BigWigsMods/packager@v2
        env:
          # Create these as repository "Actions" secrets:
          #   CF_API_KEY     - CurseForge API token (required to upload)
          #   WOWI_API_TOKEN - WoWInterface (optional)
          #   WAGO_API_TOKEN - Wago Addons (optional)
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
