name: Package and release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write   # required for the packager to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the changelog is built correctly

      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          # GITHUB_TOKEN is provided automatically -> creates the GitHub Release
          # with the packaged .zip attached. No manual secret needed.
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          # Optional: set a CF_API_KEY repo secret to ALSO publish to CurseForge
          # (bypasses CurseForge's Source packaging). Skipped if the secret is absent.
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
